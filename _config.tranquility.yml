# slogan: 首屏标题下的一行标语，留空则不显示（当前不设）
email: 2378323785@qq.com
logo: "/images/logo.svg"

mathjax: true # 加载 LateX 数学公式库

favicon: # 配置网页图标
  small: /images/favicon-16x16.png
  medium: /images/favicon-32x32.png
  apple_touch_icon: /images/apple-touch-icon.png
  safari_pinned_tab: /images/logo.svg

subpage: # 开启"子页"功能，详见 README
  enable: true
  pages:
    - name: tech # 文章的分类（category）名
      path: tech # 若不设置则默认使用 name
      title: 技术杂谈 # 菜单名
      icon: /images/icon/icon-code.svg # 图标的路径
      description: 技术分享、编程心得、开发经验 # 描述
    - name: life # 文章的分类（category）名
      path: life # 若不设置则默认使用 name
      title: 生活随笔 # 菜单名
      icon: /images/icon/icon-book.svg # 图标的路径
      description: 生活感悟、日常记录、随笔杂谈 # 描述
    - name: app # 开源作品：直接列项目，点卡片跳仓库（数据在 source/_data/projects.yml）
      path: apps
      title: 开源作品
      icon: /images/icon/icon-app.svg
      description: 最近开发的项目，点击直达仓库
      type: projects
    # 非文章分类的子页：不聚合文章，而是渲染 X（Twitter）动态。
    # 内容来自 source/_data/twitter.json，由 .github/workflows/twitter.yml 每天抓取提交。
    - name: moments
      path: moments
      title: 动态随笔
      icon: /images/icon/icon-twitter.svg
      description: 同步自 X 的碎片化动态
      type: twitter
      twitter:
        username: qfmymbx
        limit: 20 # 最多展示最近多少条，抓取脚本的 TWITTER_LIMIT 决定入库条数

index: # 配置首页个性化内容
  motto: "记录生活，分享美好"
  # 关于区只放文字，不再配照片；`text` 的每一项渲染成一个段落。
  about:
    title: 关于我
    # 一个列表项渲染成一段；空行不必写，段落之间由 CSS 控制间距。
    text:
      - 你好，我是李宏明。这里记录我的技术笔记与生活随笔。

foot:
  title:
    - "清风明月"
  linksRows: 4

links: [] # 朋友；「申请友链」入口由 foot 模板按 email 自动追加

social:
  - name: "@Justdoit-lhm"
    icon: "/images/logo-github.svg"
    url: https://github.com/Justdoit-lhm
  - name: "@qfmymbx"
    icon: "/images/logo-twitter.svg"
    url: https://x.com/qfmymbx

contacts:
  - name: "2378323785@qq.com"
    icon: "/images/icon/icon-email.svg"
    url: "mailto:2378323785@qq.com"

# 未启用的第三方集成（gitalk 评论、赞赏、相关推荐、百度统计/验证、
# Google AdSense、Algolia 搜索）连同其模板与样式一并删除，不再保留占位字段。

# 自定义字体，用于美化部分汉字的显示效果.
# 可以通过替换 _font/ 目录下的字体文件替换自己喜欢的字体
zh_font:
  enable: true
  fontName: LXGWWenKai
  type: woff2
  style:
    - normal
    - bold

# 配置时间线 参考 README.md
timeline:
  enable: true
  order: false # 是否按时间正序展示，false 为倒序
  limit: 8 # 首页时间线最多显示多少条，其余进 /timeline/；设为 0 表示不限
  items:
    - name: article
      color: "#ee936c"
      icon: /images/icon/icon-article.svg
      checked: true
    - name: event
      color: "#568dc4"
      icon: /images/icon/icon-event.svg
      checked: true

# 标签云
tagcloud:
  fancy: false
  min_font: 14
  max_font: 30

mermaid:
  enable: true # 启用 Mermaid 增强
  version: latest
  options:
    startOnload: true

search:
  path: search.json
  enable: true
  field: post
  content: true

# Algolia DocSearch 已移除：它需要真实凭据，且开启后会顶掉本地搜索。

nav:
  sticky: false
