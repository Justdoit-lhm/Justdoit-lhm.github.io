# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 清风明月的主页
subtitle: "每个人都值得被记录"
description: "李宏明的个人博客，分享技术笔记、开发经验与生活随笔"
keywords: 个人博客,技术博客,李宏明,Justdoit-lhm,编程学习,生活随笔,Hexo博客
author: 李宏明
language: zh-CN
timezone: ""

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://justdoit-lhm.github.io
permalink: :year/:month/:day/:name/
# 用 :name（文件名）而不是 :title（相对 _posts 的路径）：文章按 tech/life 分目录后，
# :title 会把目录名带进 URL（/2025/11/17/life/week1/），:name 保持不变。
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # 文件名用 <日期>-<slug> 形式（见 _config.yml permalink 注释）
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: true
# 图片用标准 Markdown 写，路径就是编辑器里看到的相对路径（文章资源目录/文件名）：
#   ![东城地坛公园](2025-11-17-weekly-01-restart/ditan-park.jpg)
# VS Code / Typora / Obsidian 预览可直接显示；scripts/post-assets.js 在构建时把它
# 换成 /2025/11/17/weekly-01-restart/ditan-park.jpg。裸文件名（ditan-park.jpg）
# 也支持，只要该文件确实在文章资源目录里。
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false

# Markdown 渲染（hexo-renderer-marked）
marked:
  # 图片路径由 scripts/post-assets.js 统一改写，这里不再使用 postAsset
  # （它按 post.slug 拼路径，文件名带日期前缀时会多出一层目录）。
  postAsset: false
  prependRoot: true

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ""
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
## 用 date 作兜底：scripts/git-updated.js 会再按 git 提交时间覆盖，避免 CI 里
## mtime 全是 checkout 时间，导致 sitemap/JSON-LD 里的“最后修改”全部变成构建当天。
updated_option: "date"

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:
  # source/upload/ 是壁纸原片等大文件的暂存区：不渲染、不拷贝进 public/。
  # hexo 的 ignore 按绝对路径匹配（box/index.js isIgnoreMatch(fullPath)），
  # 所以必须用 **/upload 前缀，写 upload/** 匹配不到。
  - '**/upload'
  - '**/upload/**'

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: tranquility

# Sitemap (hexo-generator-sitemap): https://github.com/hexojs/hexo-generator-sitemap
sitemap:
  path: sitemap.xml
  # template 指向的文件必须存在，否则 readFileSync 会直接抛错；留空使用插件内置模板
  rel: false
  tags: true
  categories: true

# Feed (hexo-generator-feed): https://github.com/hexojs/hexo-generator-feed
feed:
  enable: true
  type: [atom, rss2]
  path: [atom.xml, rss2.xml]
  limit: 20
  content: true
  icon: /images/favicon-32x32.png
  # 主题模板里已显式输出 <link rel="alternate">，避免重复注入
  autodiscovery: false

